when:
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

steps:
  - name: Preflight disk check
    command: |
      echo "Checking disk usage"
      df -h /persist /tmp /nix/store /workspace
      ls /persist
      echo "--- build env probe ---"
      nix config show build-dir 2>&1
      nix config show sandbox 2>&1
      cat /run/spindle/nix.conf 2>/dev/null
      echo "TMPDIR=$TMPDIR"
      findmnt -T /tmp
      df -h / /run /var/tmp /tmp
      systemctl show nix-daemon -p PrivateTmp 2>/dev/null

  - name: Probe build-dir location
    command: |
      nix build --impure --keep-failed --print-build-logs -o /tmp/probe-result --expr 'with import <nixpkgs> {}; runCommand "probe-fail" {} "exit 1"' 2>&1 | grep -iE 'keeping build directory|error' | head -5
      ls -d /tmp/nix-build-* /persist/tmp/nix-build-* /var/tmp/nix-build-* /run/nix-build-* /build/nix-build-* 2>/dev/null || true

  - name: Test
    command: |
      mkdir -p /workspace/builds
      chmod 755 /workspace/builds
      nix build --print-build-logs --option build-dir /workspace/builds --keep-failed || true
      df -h /persist
      du -xsh /persist/rw-store /persist/tmp
      du -xsh /workspace/builds 2>/dev/null
