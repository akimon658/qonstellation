when:
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

steps:
  - name: Preflight disk check
    command: |
      echo "Checking disk usage"
      df -h /persist /tmp /nix/store /workspace
      ls /persist

  - name: Test
    command: |
      nix build --print-build-logs --keep-failed || true
      df -h /persist
      du -xsh /persist/rw-store /persist/tmp
      du -xsh /persist/tmp/nix-build-* 2>/dev/null | sort -rh | head
